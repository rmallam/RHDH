apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: acme-plugin-kitchen-sink
  title: Plugin kitchen-sink + Dev Spaces (ROSA demo)
  description: >
    Creates a Node.js UDI repo whose catalog-info.yaml has annotations for every
    Hub plugin that works on this lab, registers it, and returns an Open in
    Dev Spaces factory URL. Bitbucket is skipped (module does not load).
  tags:
    - nodejs
    - udi
    - golden-path
    - demo
    - plugins
    - recommended
spec:
  owner: group:platform-team
  type: service
  parameters:
    - title: Application
      required: [appName]
      properties:
        appName:
          title: Application Name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,28}[a-z0-9]$'
          description: New GitHub repo name under your user
          ui:autofocus: true
        appDescription:
          title: Description
          type: string
          default: Kitchen-sink service that exercises RHDH plugin tabs
        githubOwner:
          title: GitHub owner
          type: string
          default: rmallam
        port:
          title: Application port
          type: integer
          default: 3000
        targetNamespace:
          title: Kubernetes namespace for Topology
          type: string
          default: demo-dev
        devSpacesBaseUrl:
          title: Dev Spaces URL
          type: string
          default: https://devspaces.apps.rosa.rosa-89s85.bhg0.p3.openshiftapps.com
  steps:
    - id: fetch-skeleton
      name: Fetch kitchen-sink skeleton
      action: fetch:template
      input:
        url: https://github.com/rmallam/RHDH/tree/main/golden-path/demo/skeleton-plugin-kitchen-sink
        values:
          appName: ${{ parameters.appName }}
          appDescription: ${{ parameters.appDescription }}
          githubOwner: ${{ parameters.githubOwner }}
          port: ${{ parameters.port }}
          targetNamespace: ${{ parameters.targetNamespace }}
          devSpacesBaseUrl: ${{ parameters.devSpacesBaseUrl }}
    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: github.com?owner=${{ parameters.githubOwner }}&repo=${{ parameters.appName }}
        description: ${{ parameters.appDescription }}
        defaultBranch: main
        repoVisibility: public
        gitCommitMessage: "Initial kitchen-sink app from golden path"
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    text:
      - title: Dev Spaces
        content: |
          Open Dev Spaces and create a workspace from the new repo:
          ${{ parameters.devSpacesBaseUrl }}/f?url=${{ steps['publish'].output.remoteUrl }}&new

          Plugin runbooks: docs/rhdh-plugins/README.md in the platform repo.
          Topology looks for label backstage.io/kubernetes-id=${{ parameters.appName }}
          in namespace ${{ parameters.targetNamespace }}.
    links:
      - title: Source repository
        url: ${{ steps['publish'].output.remoteUrl }}
        icon: github
      - title: Open in Dev Spaces
        url: ${{ parameters.devSpacesBaseUrl }}/f?url=${{ steps['publish'].output.remoteUrl }}&new
        icon: catalog
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
