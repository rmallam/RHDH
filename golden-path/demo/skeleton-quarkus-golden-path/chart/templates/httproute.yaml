{{- if .Values.mesh.enabled }}
# Greenfield north-south routing (HLD: Gateway API HTTPRoute, no VirtualService).
# Attaches to the ingress Gateway; backend is this app Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: {{ .Values.mesh.gateway.name }}
      namespace: {{ .Values.mesh.gateway.namespace }}
      group: gateway.networking.k8s.io
      kind: Gateway
    - name: {{ include "app.name" . }}-{{ .Release.Namespace }}
      namespace: {{ .Values.mesh.gateway.namespace }}
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - {{ include "app.meshHost" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /health
      timeouts:
        request: 5s
      backendRefs:
        - name: {{ include "app.name" . }}
          port: {{ .Values.service.port }}
    - timeouts:
        request: 30s
      backendRefs:
        - name: {{ include "app.name" . }}
          port: {{ .Values.service.port }}
{{- end }}
