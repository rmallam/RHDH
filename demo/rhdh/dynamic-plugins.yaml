# Customer plugin set. Bundled paths stay as-is (inside the RHDH image).
# OCI URLs stay on public hosts — registries.conf rewrites pulls to the internal registry.
includes:
  - dynamic-plugins.default.yaml

plugins:
  - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-ldap-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-community-plugin-topology
    disabled: false

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.45.3__3.33.3
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-tekton:
            mountPoints:
              - mountPoint: entity.page.ci/cards
                importName: TektonCI
                config:
                  if:
                    allOf:
                      - isTektonCIAvailable
                  layout:
                    gridColumn: 1 / -1
                    gridRowStart: 1

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-jenkins-backend:bs_1.49.4__0.27.0
    disabled: false
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-jenkins:bs_1.49.4__0.30.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-jenkins:
            mountPoints:
              - mountPoint: entity.page.ci/cards
                importName: EntityJenkinsContent
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isJenkinsAvailable

  # Microsoft login is built into the hub. Catalog sync stays LDAP-only
  # until we add Graph / Keycloak providers (those modules require config).
  - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-msgraph-dynamic
    disabled: true
  - package: ./dynamic-plugins/dist/backstage-community-plugin-catalog-backend-module-keycloak-dynamic
    disabled: true

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-backstage-plugin-argo-cd-backend:bs_1.45.3__4.6.0
    disabled: false
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.45.3__2.4.4
    disabled: false
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-argocd:bs_1.45.3__1.8.1
    disabled: false

  - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-techdocs-backend-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-techdocs
    disabled: false

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-sonarqube:bs_1.45.3__0.21.0
    disabled: false
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-sonarqube-backend:bs_1.45.3__0.15.0
    disabled: false

  # Vendor Snyk frontend, self-exported to our GHCR (no Red Hat overlay).
  - package: oci://ghcr.io/rmallam/rhdh-plugin-snyk:bs_1.49.4__2.5.10!backstage-plugin-snyk
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-plugin-snyk:
            mountPoints:
              - mountPoint: entity.page.security/cards
                importName: SnykOverview
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isSnykAvailable

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-backstage-plugin-jira:bs_1.49.4__2.14.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          roadiehq.backstage-plugin-jira:
            mountPoints:
              - mountPoint: entity.page.overview/cards
                importName: EntityJiraOverviewCard
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isJiraAvailable

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-jfrog-artifactory:bs_1.49.4__1.28.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-artifactory:
            mountPoints:
              - mountPoint: entity.page.image-registry/cards
                importName: ArtifactoryPage
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isArtifactoryAvailable

  - package: ./dynamic-plugins/dist/backstage-plugin-notifications
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-notifications-backend-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-signals
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-signals-backend-dynamic
    disabled: false
  # RBAC frontend/backend ship in dynamic-plugins.default.yaml
  # as backstage-community-plugin-rbac (already enabled on this instance).

  # HashiCorp Vault — no GA `bs_` overlay on GHCR yet (only pr_1225 tags).
  # Enable when we install Vault and pin a published tag.
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-vault-backend:bs_1.49.4__0.31.0
    disabled: true
    pluginConfig:
      vault:
        baseUrl: https://vault.example.invalid
        token: placeholder-list-only
        secretEngine: secrets
        kvVersion: 2
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-vault:bs_1.49.4__0.31.0
    disabled: true
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-vault:
            mountPoints:
              - mountPoint: entity.page.overview/cards
                importName: EntityVaultCard
                config:
                  layout:
                    gridColumn: 1 / -1

  # ServiceNow — scaffolder table actions + entity / profile tickets
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-scaffolder-backend-module-servicenow:bs_1.49.4__2.15.1
    disabled: false
    pluginConfig:
      servicenow:
        baseUrl: https://example.service-now.com
        username: placeholder
        password: placeholder
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-servicenow-backend:bs_1.49.4__1.10.0
    disabled: false
    pluginConfig:
      servicenow:
        instanceUrl: https://example.service-now.com
        basicAuth:
          username: placeholder
          password: placeholder
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-servicenow:bs_1.49.4__1.10.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-servicenow:
            entityTabs:
              - path: /servicenow
                title: ServiceNow
                mountPoint: entity.page.servicenow
            mountPoints:
              - mountPoint: entity.page.servicenow/cards
                importName: ServicenowPage
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    anyOf:
                      - hasAnnotation: servicenow.com/entity-id

  # Dynatrace — entity monitoring card + DQL
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-dynatrace:bs_1.49.4__10.17.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-dynatrace:
            mountPoints:
              - mountPoint: entity.page.monitoring/cards
                importName: DynatraceTab
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isDynatraceAvailable
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/dynatrace-backstage-plugin-dql-backend:bs_1.49.4__2.7.0
    disabled: false
    pluginConfig:
      dynatrace:
        environments:
          - name: default
            url: https://example.live.dynatrace.com
            tokenUrl: https://example.live.dynatrace.com
            clientId: placeholder
            clientSecret: placeholder
            accountUrn: placeholder
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/dynatrace-backstage-plugin-dql:bs_1.49.4__2.7.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          dynatrace.backstage-plugin-dql:
            mountPoints:
              - mountPoint: entity.page.monitoring/cards
                importName: DynatraceTab
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isDynatraceAvailable

  # IBM API Connect — catalog of APIs from APIC (v10). Quote URLs that contain '!'.
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/apic-backstage:bs_1.49.4__1.0.3
    disabled: false
    pluginConfig:
      ibm:
        schedule: "0 * * * *"
        apic:
          - name: wnzl-apic
            url: https://apic.example.invalid
            clientId: placeholder
            clientSecret: placeholder
            apiKey: placeholder
