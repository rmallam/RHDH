# Cluster-scoped. Apply once per cluster (platform team).
# Match server, KV mount, and serviceAccountRef to the Vault kubernetes auth role.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-secret-store
spec:
  provider:
    vault:
      server: https://vault.customer.example.com
      path: kv
      version: v2
      # caProvider:
      #   type: Secret
      #   name: vault-ca
      #   namespace: external-secrets
      #   key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: rhdh-role
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
