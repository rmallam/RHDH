# Same contract as components/developer-hub/base/instance/secret-env.yaml
# Apply in namespace rhdh after ClusterSecretStore vault-secret-store exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhdh-secrets
  namespace: rhdh
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    name: rhdh-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: BACKEND_SECRET
      remoteRef:
        key: secrets/rhdh/backend-secret
        property: value
    - secretKey: AZURE_TENANT_ID
      remoteRef:
        key: secrets/rhdh/azure-tenant-id
        property: value
    - secretKey: AZURE_CLIENT_ID
      remoteRef:
        key: secrets/rhdh/azure-acme-id
        property: value
    - secretKey: AZURE_CLIENT_SECRET
      remoteRef:
        key: secrets/rhdh/azure-acme-secret
        property: value
    - secretKey: LDAP_BIND_PASSWORD
      remoteRef:
        key: secrets/rhdh/ldap-bind-password
        property: value
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: secrets/rhdh/github-token
        property: value
    - secretKey: JENKINS_BASE_URL
      remoteRef:
        key: secrets/rhdh/jenkins-base-url
        property: value
    - secretKey: JENKINS_USERNAME
      remoteRef:
        key: secrets/rhdh/jenkins-username
        property: value
    - secretKey: JENKINS_API_TOKEN
      remoteRef:
        key: secrets/rhdh/jenkins-api-token
        property: value
    - secretKey: ARGOCD_TOKEN
      remoteRef:
        key: secrets/rhdh/argocd-token
        property: value
    - secretKey: SONARQUBE_API_KEY
      remoteRef:
        key: secrets/rhdh/sonarqube-api-key
        property: value
    - secretKey: JIRA_BASE_URL
      remoteRef:
        key: secrets/rhdh/jira-base-url
        property: value
    - secretKey: JIRA_TOKEN
      remoteRef:
        key: secrets/rhdh/jira-token
        property: value
    - secretKey: SNYK_TOKEN
      remoteRef:
        key: secrets/rhdh/snyk-token
        property: value
    - secretKey: ARTIFACTORY_TOKEN
      remoteRef:
        key: secrets/rhdh/artifactory-token
        property: value
    - secretKey: VAULT_ADDR
      remoteRef:
        key: secrets/rhdh/vault-addr
        property: value
    - secretKey: VAULT_TOKEN
      remoteRef:
        key: secrets/rhdh/vault-list-token
        property: value
    - secretKey: SERVICENOW_BASE_URL
      remoteRef:
        key: secrets/rhdh/servicenow-base-url
        property: value
    - secretKey: SERVICENOW_USERNAME
      remoteRef:
        key: secrets/rhdh/servicenow-username
        property: value
    - secretKey: SERVICENOW_PASSWORD
      remoteRef:
        key: secrets/rhdh/servicenow-password
        property: value
    - secretKey: DYNATRACE_URL
      remoteRef:
        key: secrets/rhdh/dynatrace-url
        property: value
    - secretKey: DYNATRACE_CLIENT_ID
      remoteRef:
        key: secrets/rhdh/dynatrace-client-id
        property: value
    - secretKey: DYNATRACE_CLIENT_SECRET
      remoteRef:
        key: secrets/rhdh/dynatrace-client-secret
        property: value
    - secretKey: DYNATRACE_ACCOUNT_URN
      remoteRef:
        key: secrets/rhdh/dynatrace-account-urn
        property: value
    - secretKey: APIC_API_URL
      remoteRef:
        key: secrets/rhdh/apic-api-url
        property: value
    - secretKey: APIC_CLIENT_ID
      remoteRef:
        key: secrets/rhdh/apic-client-id
        property: value
    - secretKey: APIC_SECRET
      remoteRef:
        key: secrets/rhdh/apic-secret
        property: value
    - secretKey: APIC_API_KEY
      remoteRef:
        key: secrets/rhdh/apic-api-key
        property: value
