apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rhdh
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: app-config-rhdh
    files:
      - app-config.yaml
  - name: dynamic-plugins-rhdh
    files:
      - dynamic-plugins.yaml
  - name: rbac-policies
    files:
      - rbac-policies.csv
resources:
  - backstage-cr.yaml
