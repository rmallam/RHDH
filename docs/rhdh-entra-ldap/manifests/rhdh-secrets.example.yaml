# Copy to a local file that is NOT committed. Fill values, then:
#   oc -n rhdh apply -f rhdh-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-secrets
  namespace: rhdh
type: Opaque
stringData:
  BACKEND_SECRET: REPLACE_LONG_RANDOM_STRING
  AZURE_TENANT_ID: REPLACE_ENTRA_TENANT_ID
  AZURE_CLIENT_ID: REPLACE_RHDH_LOGIN_APP_CLIENT_ID
  AZURE_CLIENT_SECRET: REPLACE_RHDH_LOGIN_APP_CLIENT_SECRET
  LDAP_BIND_PASSWORD: REPLACE_LDAP_BIND_PASSWORD
  # Optional — only if app-config integrations.github is enabled
  GITHUB_TOKEN: REPLACE_GITHUB_PAT
