# Extra keys for Vault / ServiceNow / Dynatrace / IBM API Connect.
# Merge into rhdh-secrets. Do not commit filled values.
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-plugin-secrets
  namespace: rhdh
type: Opaque
stringData:
  VAULT_ADDR: https://vault.example.com
  VAULT_TOKEN: REPLACE_LIST_ONLY_TOKEN
  SERVICENOW_BASE_URL: https://example.service-now.com
  SERVICENOW_USERNAME: REPLACE_SNOW_USER
  SERVICENOW_PASSWORD: REPLACE_SNOW_PASSWORD
  DYNATRACE_URL: https://example.live.dynatrace.com
  DYNATRACE_CLIENT_ID: REPLACE_DT_CLIENT_ID
  DYNATRACE_CLIENT_SECRET: REPLACE_DT_CLIENT_SECRET
  DYNATRACE_ACCOUNT_URN: REPLACE_DT_ACCOUNT_URN
  APIC_API_URL: https://apic.example.com
  APIC_CLIENT_ID: REPLACE_APIC_CLIENT_ID
  APIC_SECRET: REPLACE_APIC_CLIENT_SECRET
  APIC_API_KEY: REPLACE_APIC_API_KEY
