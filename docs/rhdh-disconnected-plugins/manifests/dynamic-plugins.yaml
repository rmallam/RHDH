# Customer plugin set. Bundled paths stay as-is (inside the RHDH image).
# OCI URLs stay on public hosts — registries.conf rewrites pulls to the internal registry.
includes:
  - dynamic-plugins.default.yaml

plugins:
  - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-ldap-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-community-plugin-topology
    disabled: false

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.45.3__3.33.3
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-tekton:
            mountPoints:
              - mountPoint: entity.page.ci/cards
                importName: TektonCI
                config:
                  if:
                    allOf:
                      - isTektonCIAvailable
                  layout:
                    gridColumn: 1 / -1
                    gridRowStart: 1

  - package: ./dynamic-plugins/dist/backstage-community-plugin-jenkins-backend-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-community-plugin-jenkins
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-jenkins:
            mountPoints:
              - mountPoint: entity.page.ci/cards
                importName: EntityJenkinsContent
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isJenkinsAvailable

  - package: ./dynamic-plugins/dist/backstage-plugin-auth-backend-module-microsoft-provider-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-community-plugin-catalog-backend-module-msgraph-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-community-plugin-catalog-backend-module-keycloak-dynamic
    disabled: false

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-backstage-plugin-argo-cd-backend:bs_1.45.3__4.6.0
    disabled: false
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.45.3__2.4.4
    disabled: false
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-argocd:bs_1.45.3__1.8.1
    disabled: false

  - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-bitbucket-cloud-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-bitbucket-cloud-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-bitbucket-server-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-github-actions
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-github-issues
    disabled: false

  - package: ./dynamic-plugins/dist/backstage-plugin-api-docs
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage.plugin-api-docs:
            mountPoints:
              - mountPoint: entity.page.api/cards
                importName: EntityApiDefinitionCard
                config:
                  layout:
                    gridColumn: 1 / -1

  - package: ./dynamic-plugins/dist/backstage-plugin-techdocs-backend-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-techdocs
    disabled: false

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-sonarqube:bs_1.45.3__0.21.0
    disabled: false
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-sonarqube-backend:bs_1.45.3__0.15.0
    disabled: false

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-snyk:bs_1.45.3__2.3.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-snyk:
            mountPoints:
              - mountPoint: entity.page.security/cards
                importName: SnykEntityComponent
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isSnykAvailable

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-backstage-plugin-jira:bs_1.45.3__2.6.1
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          roadiehq.backstage-plugin-jira:
            mountPoints:
              - mountPoint: entity.page.overview/cards
                importName: EntityJiraOverviewCard
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isJiraAvailable

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-artifactory:bs_1.45.3__0.3.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-artifactory:
            mountPoints:
              - mountPoint: entity.page.image-registry/cards
                importName: ArtifactoryPage
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isArtifactoryAvailable

  - package: ./dynamic-plugins/dist/backstage-plugin-notifications
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-notifications-backend-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-signals
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-signals-backend-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-rbac-backend-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-rbac
    disabled: false

  # HashiCorp Vault — LIST-only K/V v2 (WNZL req 43). Token must not allow secret payload read.
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-vault-backend:bs_1.49.4__0.31.0
    disabled: false
    pluginConfig:
      vault:
        baseUrl: ${VAULT_ADDR}
        token: ${VAULT_TOKEN}
        secretEngine: secrets
        kvVersion: 2
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-vault:bs_1.49.4__0.31.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-vault:
            mountPoints:
              - mountPoint: entity.page.overview/cards
                importName: EntityVaultCard
                config:
                  layout:
                    gridColumn: 1 / -1

  # ServiceNow — scaffolder table actions + entity / profile tickets
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-scaffolder-backend-module-servicenow:bs_1.49.4__2.15.1
    disabled: false
    pluginConfig:
      servicenow:
        baseUrl: ${SERVICENOW_BASE_URL}
        username: ${SERVICENOW_USERNAME}
        password: ${SERVICENOW_PASSWORD}
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-servicenow-backend:bs_1.45.3__1.6.1
    disabled: false
    pluginConfig:
      servicenow:
        instanceUrl: ${SERVICENOW_BASE_URL}
        basicAuth:
          username: ${SERVICENOW_USERNAME}
          password: ${SERVICENOW_PASSWORD}
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-servicenow:bs_1.45.3__1.6.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-servicenow:
            entityTabs:
              - path: /servicenow
                title: ServiceNow
                mountPoint: entity.page.servicenow
            mountPoints:
              - mountPoint: entity.page.servicenow/cards
                importName: ServicenowPage
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    anyOf:
                      - hasAnnotation: servicenow.com/entity-id

  # Dynatrace — entity monitoring card + DQL
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-dynatrace:bs_1.49.4__10.17.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-dynatrace:
            mountPoints:
              - mountPoint: entity.page.monitoring/cards
                importName: DynatraceTab
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isDynatraceAvailable
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/dynatrace-backstage-plugin-dql-backend:bs_1.52.0__2.8.0
    disabled: false
    pluginConfig:
      dynatrace:
        environments:
          - name: default
            url: ${DYNATRACE_URL}
            tokenUrl: ${DYNATRACE_URL}
            clientId: ${DYNATRACE_CLIENT_ID}
            clientSecret: ${DYNATRACE_CLIENT_SECRET}
            accountUrn: ${DYNATRACE_ACCOUNT_URN}
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/dynatrace-backstage-plugin-dql:bs_1.52.0__2.8.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          dynatrace.backstage-plugin-dql:
            mountPoints:
              - mountPoint: entity.page.monitoring/cards
                importName: DynatraceTab
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isDynatraceAvailable

  # IBM API Connect — catalog of APIs from APIC (v10). Quote URLs that contain '!'.
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/apic-backstage:bs_1.49.4__1.0.0
    disabled: false
    pluginConfig:
      ibm:
        schedule: "0 * * * *"
        apic:
          - name: wnzl-apic
            url: ${APIC_API_URL}
            clientId: ${APIC_CLIENT_ID}
            clientSecret: ${APIC_SECRET}
            apiKey: ${APIC_API_KEY}
